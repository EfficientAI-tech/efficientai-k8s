name: Lint and Test Charts

on:
  pull_request:
    branches:
      - main
    paths:
      - 'charts/**'
      - 'examples/**'
      - '.github/workflows/lint-test.yml'

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.20.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git

      - name: Add chart dependency repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Run helm dependency update
        run: helm dependency update charts/efficientai

      - name: Run helm lint
        run: helm lint charts/efficientai

      - name: Run chart-testing (lint)
        run: ct lint --target-branch main --chart-dirs charts --validate-maintainers=false

      - name: Run helm unittest
        run: helm unittest charts/efficientai --color

      - name: Render examples with helm template
        run: |
          for f in examples/*.yaml; do
            echo "=== Rendering with $f ==="
            helm template dev charts/efficientai -f "$f" > /dev/null
          done
