name: Release Charts

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/release.yml'

  # Manual trigger from the Actions UI:
  #   Actions → Release Charts → Run workflow
  # Fill in the inputs to bump Chart.yaml + cut a release in one go.
  workflow_dispatch:
    inputs:
      chart_version:
        description: 'Explicit chart version (e.g. 0.2.0). Leave empty to auto-bump.'
        required: false
        type: string
      chart_bump:
        description: 'Auto-bump kind (used only when chart_version is empty)'
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      app_version:
        description: 'Upstream EfficientAI appVersion (e.g. 1.4.6). Leave empty to keep current.'
        required: false
        type: string

permissions:
  contents: write
  pages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Required so the bump commit can be pushed back to main.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      # Only runs on workflow_dispatch. Updates Chart.yaml in-place, commits,
      # and pushes back to main. The push triggered by GITHUB_TOKEN does NOT
      # re-trigger this workflow (GitHub's anti-loop policy), so we can
      # immediately fall through into chart-releaser below.
      - name: Bump Chart.yaml
        if: github.event_name == 'workflow_dispatch'
        env:
          CHART_VERSION_INPUT: ${{ inputs.chart_version }}
          CHART_BUMP: ${{ inputs.chart_bump }}
          APP_VERSION_INPUT: ${{ inputs.app_version }}
        run: |
          set -euo pipefail
          CHART_FILE=charts/efficientai/Chart.yaml
          CURRENT=$(awk '/^version:/ {print $2; exit}' "$CHART_FILE")
          CURRENT_APP=$(awk '/^appVersion:/ {gsub(/"/,""); print $2; exit}' "$CHART_FILE")
          echo "Current chart version: $CURRENT"
          echo "Current appVersion:    $CURRENT_APP"

          if [ -n "$CHART_VERSION_INPUT" ]; then
            NEW_VERSION="$CHART_VERSION_INPUT"
          else
            IFS='.' read -r MAJ MIN PAT <<<"$CURRENT"
            case "$CHART_BUMP" in
              major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
              minor) MIN=$((MIN+1)); PAT=0 ;;
              patch|*) PAT=$((PAT+1)) ;;
            esac
            NEW_VERSION="$MAJ.$MIN.$PAT"
          fi

          NEW_APP="$CURRENT_APP"
          if [ -n "$APP_VERSION_INPUT" ]; then
            NEW_APP="$APP_VERSION_INPUT"
          fi

          echo "Bumping chart: $CURRENT -> $NEW_VERSION"
          echo "Setting appVersion: $CURRENT_APP -> $NEW_APP"
          sed -i "s/^version: .*/version: $NEW_VERSION/" "$CHART_FILE"
          sed -i "s/^appVersion: .*/appVersion: \"$NEW_APP\"/" "$CHART_FILE"

          MSG="chore(release): bump chart to $NEW_VERSION (appVersion $NEW_APP)"
          if git diff --quiet "$CHART_FILE"; then
            echo "No-op: Chart.yaml already at requested versions."
          else
            git add "$CHART_FILE"
            git commit -m "$MSG"
            git push origin HEAD:main
          fi

      - name: Add chart dependency repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      # chart-releaser-action requires the gh-pages branch to already exist;
      # bootstrap it on first run so the action doesn't fail with
      # `fatal: invalid reference: origin/gh-pages`.
      - name: Ensure gh-pages branch exists
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "gh-pages branch already exists, nothing to do."
            exit 0
          fi
          echo "Creating empty gh-pages branch..."
          git worktree add --orphan -b gh-pages /tmp/gh-pages
          pushd /tmp/gh-pages >/dev/null
          git rm -rf . >/dev/null 2>&1 || true
          printf '# EfficientAI Helm chart repository\n\nServed by [chart-releaser](https://github.com/helm/chart-releaser-action) over GitHub Pages.\n' > README.md
          git add README.md
          git commit -m "Initialize gh-pages branch"
          git push origin gh-pages
          popd >/dev/null
          git worktree remove /tmp/gh-pages

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
