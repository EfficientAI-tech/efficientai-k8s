name: Release Charts

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/release.yml'

permissions:
  contents: write
  pages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Add chart dependency repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      # chart-releaser-action requires the gh-pages branch to already exist;
      # bootstrap it on first run so the action doesn't fail with
      # `fatal: invalid reference: origin/gh-pages`.
      - name: Ensure gh-pages branch exists
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "gh-pages branch already exists, nothing to do."
            exit 0
          fi
          echo "Creating empty gh-pages branch..."
          git worktree add --orphan -b gh-pages /tmp/gh-pages
          pushd /tmp/gh-pages >/dev/null
          git rm -rf . >/dev/null 2>&1 || true
          printf '# EfficientAI Helm chart repository\n\nServed by [chart-releaser](https://github.com/helm/chart-releaser-action) over GitHub Pages.\n' > README.md
          git add README.md
          git commit -m "Initialize gh-pages branch"
          git push origin gh-pages
          popd >/dev/null
          git worktree remove /tmp/gh-pages

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
