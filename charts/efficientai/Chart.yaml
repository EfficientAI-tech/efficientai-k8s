apiVersion: v2
name: efficientai
description: A Helm chart for the EfficientAI Voice AI Evaluation Platform
type: application
version: 0.1.3
appVersion: "1.5.7"
kubeVersion: ">=1.23.0-0"
home: https://github.com/EfficientAI-tech/efficientai-k8s
icon: https://raw.githubusercontent.com/EfficientAI-tech/efficientai-k8s/main/charts/efficientai/icon.png
sources:
  - https://github.com/EfficientAI-tech/efficientAI
  - https://github.com/EfficientAI-tech/efficientai-k8s
maintainers:
  - name: EfficientAI
    url: https://github.com/EfficientAI-tech
keywords:
  - voice-ai
  - evaluation
  - llm
  - celery
  - fastapi
annotations:
  category: AI
  licenses: MIT
  efficientai.platformSecurityRelease: "Pin efficientai.image.*.tag to a GHCR release that includes PR #124 (cookie sessions) when upgrading."
dependencies:
  - name: postgresql
    version: "15.5.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.deploy
  - name: redis
    version: "20.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.deploy
