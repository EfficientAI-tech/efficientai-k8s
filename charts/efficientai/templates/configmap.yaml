apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "efficientai.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "efficientai.labels" . | nindent 4 }}
data:
  config.yml: |
    # Rendered by the efficientai Helm chart.
    #
    # IMPORTANT: This chart does NOT write secrets or connection URLs into
    # config.yml. The app's YAML loader (app/config.py:load_config_from_file)
    # assigns values literally without env-var expansion, so writing
    # `${DATABASE_URL}` here would corrupt the env-derived value.
    #
    # Instead, the chart sets these as pod environment variables and lets
    # Pydantic Settings pick them up before YAML loads:
    #
    #   - DATABASE_URL          (built from POSTGRES_USER/PASSWORD/HOST/PORT/DB)
    #   - REDIS_URL             (built from REDIS_HOST/PORT[/auth])
    #   - CELERY_BROKER_URL     (= REDIS_URL)
    #   - CELERY_RESULT_BACKEND (= REDIS_URL)
    #   - SECRET_KEY            (efficientai.secretKey)
    #   - ENCRYPTION_KEY        (efficientai.encryptionKey)
    #   - HUGGINGFACE_TOKEN     (efficientai.huggingfaceToken)
    #   - EFFICIENTAI_LICENSE   (efficientai.license)
    #   - S3_ACCESS_KEY_ID      (s3.accessKeyId)
    #   - S3_SECRET_ACCESS_KEY  (s3.secretAccessKey)
    #
    # Only NON-SECRET config goes here.
    {{- $cfg := deepCopy .Values.efficientai.config }}

    {{- /* Strip any secret/url keys that may have been set under efficientai.config */ -}}
    {{- $_ := unset $cfg "database" }}
    {{- $_  = unset $cfg "redis" }}
    {{- $_  = unset $cfg "celery" }}
    {{- $_  = unset $cfg "license" }}
    {{- if hasKey $cfg "app" }}
    {{- $app := get $cfg "app" }}
    {{- $_    = unset $app "secret_key" }}
    {{- $_    = set $cfg "app" $app }}
    {{- end }}
    {{- if hasKey $cfg "diarization" }}
    {{- $dia := get $cfg "diarization" }}
    {{- $_    = unset $dia "huggingface_token" }}
    {{- $_    = set $cfg "diarization" $dia }}
    {{- end }}

    {{- /* s3 (voice recording blob storage) — bucket/region/endpoint/prefix only.
           Credentials come from env vars (S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY). */ -}}
    {{- if .Values.s3.enabled }}
    {{- $s3 := dict
        "enabled"      true
        "bucket_name"  .Values.s3.bucket
        "region"       .Values.s3.region
        "endpoint_url" (default nil .Values.s3.endpoint)
        "prefix"       .Values.s3.prefix
    }}
    {{- $_ := set $cfg "s3" $s3 }}
    {{- else }}
    {{- $_ := set $cfg "s3" (dict "enabled" false) }}
    {{- end }}

    {{- toYaml $cfg | nindent 4 }}
