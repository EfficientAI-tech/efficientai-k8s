{{- /*
Render the in-chart Secret only for keys supplied as inline `value:` AND when
the user has NOT pointed to an existing secret via `secretKeyRef:` /
`existingSecret:`. Each key wired via `secretKeyRef:` is sourced from the
user-managed Secret directly by the deployment env block.
*/ -}}
{{- $hasAppSecretKey       := and (include "efficientai.hasInlineValue" .Values.efficientai.secretKey)        (not (and .Values.efficientai.secretKey.secretKeyRef        .Values.efficientai.secretKey.secretKeyRef.name)) -}}
{{- $hasAppEncryptionKey   := and (include "efficientai.hasInlineValue" .Values.efficientai.encryptionKey)    (not (and .Values.efficientai.encryptionKey.secretKeyRef    .Values.efficientai.encryptionKey.secretKeyRef.name)) -}}
{{- $hasAppHF              := and (include "efficientai.hasInlineValue" .Values.efficientai.huggingfaceToken) (not (and .Values.efficientai.huggingfaceToken.secretKeyRef .Values.efficientai.huggingfaceToken.secretKeyRef.name)) -}}
{{- $hasAppLicense         := and (include "efficientai.hasInlineValue" .Values.efficientai.license)          (not (and .Values.efficientai.license.secretKeyRef          .Values.efficientai.license.secretKeyRef.name)) -}}
{{- $hasS3AccessKey        := false -}}
{{- $hasS3SecretAccessKey  := false -}}
{{- if .Values.s3.enabled -}}
{{- $hasS3AccessKey       = and (include "efficientai.hasInlineValue" .Values.s3.accessKeyId)     (not (and .Values.s3.accessKeyId.secretKeyRef     .Values.s3.accessKeyId.secretKeyRef.name)) -}}
{{- $hasS3SecretAccessKey = and (include "efficientai.hasInlineValue" .Values.s3.secretAccessKey) (not (and .Values.s3.secretAccessKey.secretKeyRef .Values.s3.secretAccessKey.secretKeyRef.name)) -}}
{{- end -}}
{{- $hasPgPassword         := and .Values.postgresql.auth.password (not .Values.postgresql.auth.existingSecret) -}}
{{- $hasRedisPassword      := and .Values.redis.auth (and .Values.redis.auth.password (not .Values.redis.auth.existingSecret)) -}}
{{- $any := or (or (or $hasAppSecretKey $hasAppEncryptionKey) (or $hasAppHF $hasAppLicense)) (or (or $hasS3AccessKey $hasS3SecretAccessKey) (or $hasPgPassword $hasRedisPassword)) -}}
{{- if $any }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "efficientai.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "efficientai.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $hasAppSecretKey }}
  SECRET_KEY: {{ .Values.efficientai.secretKey.value | quote }}
  {{- end }}
  {{- if $hasAppEncryptionKey }}
  ENCRYPTION_KEY: {{ .Values.efficientai.encryptionKey.value | quote }}
  {{- end }}
  {{- if $hasAppHF }}
  HUGGINGFACE_TOKEN: {{ .Values.efficientai.huggingfaceToken.value | quote }}
  {{- end }}
  {{- if $hasAppLicense }}
  EFFICIENTAI_LICENSE: {{ .Values.efficientai.license.value | quote }}
  {{- end }}
  {{- if $hasS3AccessKey }}
  S3_ACCESS_KEY_ID: {{ .Values.s3.accessKeyId.value | quote }}
  {{- end }}
  {{- if $hasS3SecretAccessKey }}
  S3_SECRET_ACCESS_KEY: {{ .Values.s3.secretAccessKey.value | quote }}
  {{- end }}
  {{- if $hasPgPassword }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  {{- end }}
  {{- if $hasRedisPassword }}
  REDIS_PASSWORD: {{ .Values.redis.auth.password | quote }}
  {{- end }}
{{- end }}
{{- /*
When the in-chart postgres subchart is deployed, mirror the password into the
subchart's expected key naming via global.postgresql.auth so the subchart can
consume it via existingSecret. We accomplish this by ensuring values.yaml sets
postgresql.auth.password, and the Bitnami chart reads it directly.
*/ -}}
