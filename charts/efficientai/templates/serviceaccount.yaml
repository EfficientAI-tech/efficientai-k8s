{{- if .Values.efficientai.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "efficientai.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "efficientai.labels" . | nindent 4 }}
  {{- with .Values.efficientai.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
