{{- $component := "web" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "efficientai.componentFullname" (dict "root" . "component" $component) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "efficientai.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  {{- with .Values.efficientai.web.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.efficientai.web.service.type }}
  ports:
    - port: {{ .Values.efficientai.web.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "efficientai.componentSelectorLabels" (dict "root" . "component" $component) | nindent 4 }}
