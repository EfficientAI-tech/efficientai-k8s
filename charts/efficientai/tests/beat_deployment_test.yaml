suite: beat deployment
templates:
  - templates/beat/deployment.yaml
  - templates/configmap.yaml
tests:
  - it: renders celery beat with co-located platform worker
    template: templates/beat/deployment.yaml
    set:
      efficientai.secretKey.value: "x"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.replicas
          value: 1
      - contains:
          path: spec.template.spec.containers[0].command
          content: sh
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "celery -A app.workers.celery_app worker -Q platform"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "celery -A app.workers.celery_app beat"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'kill -0 "\$WORKER_PID"'

  - it: respects custom beat platform queue and concurrency
    template: templates/beat/deployment.yaml
    set:
      efficientai.secretKey.value: "x"
      efficientai.beat.platformQueue: custom-platform
      efficientai.beat.platformConcurrency: 4
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "-Q custom-platform"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "--concurrency 4"

  - it: uses a fully custom command when beat.command is set
    template: templates/beat/deployment.yaml
    set:
      efficientai.secretKey.value: "x"
      efficientai.beat.command:
        - celery
        - -A
        - app.workers.celery_app
        - beat
        - --loglevel=info
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: celery
      - notContains:
          path: spec.template.spec.containers[0].command
          content: sh

  - it: omits beat deployment when disabled
    template: templates/beat/deployment.yaml
    set:
      efficientai.secretKey.value: "x"
      efficientai.beat.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: fails when replicaCount is not 1
    template: templates/beat/deployment.yaml
    set:
      efficientai.secretKey.value: "x"
      efficientai.beat.replicaCount: 2
    asserts:
      - failedTemplate: {}
