suite: web ingress
templates:
  - templates/web/ingress.yaml
tests:
  - it: does not render when ingress is disabled
    set:
      efficientai.secretKey.value: "x"
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an ingress with default backend pointing at the web service
    set:
      efficientai.secretKey.value: "x"
      efficientai.web.ingress.enabled: true
      efficientai.web.ingress.className: nginx
      efficientai.web.ingress.hosts:
        - host: efficientai.example.com
          paths:
            - path: /
              pathType: Prefix
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Ingress
      - equal:
          path: spec.ingressClassName
          value: nginx
      - equal:
          path: spec.rules[0].host
          value: efficientai.example.com
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: RELEASE-NAME-efficientai-web

  - it: honors a custom per-path backend
    set:
      efficientai.secretKey.value: "x"
      efficientai.web.ingress.enabled: true
      efficientai.web.ingress.hosts:
        - host: efficientai.example.com
          paths:
            - path: /api/webhook
              pathType: Prefix
              backend:
                service:
                  name: webhook-service
                  port:
                    number: 8080
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: webhook-service
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 8080
