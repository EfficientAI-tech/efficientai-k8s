suite: secret rendering (inline value vs secretKeyRef)
templates:
  - templates/secret.yaml
tests:
  - it: renders the in-chart secret with inline values
    set:
      efficientai.secretKey.value: "abc123"
      efficientai.encryptionKey.value: "enc-key"
      s3.enabled: true
      s3.accessKeyId.value: "AKIA"
      s3.secretAccessKey.value: "shh"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: stringData.SECRET_KEY
          value: "abc123"
      - equal:
          path: stringData.ENCRYPTION_KEY
          value: "enc-key"
      - equal:
          path: stringData.S3_ACCESS_KEY_ID
          value: "AKIA"
      - equal:
          path: stringData.S3_SECRET_ACCESS_KEY
          value: "shh"

  - it: skips secret when only secretKeyRefs are provided
    set:
      efficientai.secretKey:
        secretKeyRef:
          name: my-secret
          key: SECRET_KEY
      efficientai.encryptionKey:
        secretKeyRef:
          name: my-secret
          key: ENCRYPTION_KEY
      s3.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: includes postgres password when provided inline
    set:
      efficientai.secretKey.value: "x"
      postgresql.deploy: true
      postgresql.auth.password: "pgpass"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: stringData.POSTGRES_PASSWORD
          value: "pgpass"

  - it: does not include postgres password when existingSecret is set
    set:
      efficientai.secretKey.value: "x"
      postgresql.auth.password: "ignored"
      postgresql.auth.existingSecret: my-pg-secret
    asserts:
      - hasDocuments:
          count: 1
      - notExists:
          path: stringData.POSTGRES_PASSWORD
