suite: worker-imports deployment
templates:
  - templates/worker-imports/deployment.yaml
  - templates/configmap.yaml
tests:
  - it: renders eai worker with queues, pool, and concurrency by default
    template: templates/worker-imports/deployment.yaml
    set:
      efficientai.secretKey.value: "x"
    asserts:
      - hasDocuments:
          count: 1
      - contains:
          path: spec.template.spec.containers[0].command
          content: eai
      - contains:
          path: spec.template.spec.containers[0].command
          content: worker
      - contains:
          path: spec.template.spec.containers[0].command
          content: --queues
      - contains:
          path: spec.template.spec.containers[0].command
          content: imports,diarization,evaluations
      - contains:
          path: spec.template.spec.containers[0].command
          content: --pool
      - contains:
          path: spec.template.spec.containers[0].command
          content: threads
      - contains:
          path: spec.template.spec.containers[0].command
          content: --concurrency
      - contains:
          path: spec.template.spec.containers[0].command
          content: "32"

  - it: respects custom workerImports pool and concurrency
    template: templates/worker-imports/deployment.yaml
    set:
      efficientai.secretKey.value: "x"
      efficientai.workerImports.pool: prefork
      efficientai.workerImports.concurrency: 16
      efficientai.workerImports.queues: "imports,heavy"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: --pool
      - contains:
          path: spec.template.spec.containers[0].command
          content: prefork
      - contains:
          path: spec.template.spec.containers[0].command
          content: imports,heavy
      - contains:
          path: spec.template.spec.containers[0].command
          content: "16"

  - it: uses a fully custom command when workerImports.command is set
    template: templates/worker-imports/deployment.yaml
    set:
      efficientai.secretKey.value: "x"
      efficientai.workerImports.command:
        - celery
        - -A
        - app.workers.celery_app
        - worker
        - --loglevel=info
    asserts:
      - contains:
          path: spec.template.spec.containers[0].command
          content: celery
      - notContains:
          path: spec.template.spec.containers[0].command
          content: eai
