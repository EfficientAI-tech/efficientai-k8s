# Connect to an externally-managed Postgres (RDS / Cloud SQL / etc.).
#
# Steps:
#   1. Create a secret with the password:
#        kubectl create secret generic efficientai-postgres \
#          --from-literal=password='REDACTED'
#   2. helm install dev efficientai/efficientai -f examples/external-postgres.yaml

efficientai:
  secretKey:
    value: "change-me-openssl-rand-hex-32"

postgresql:
  deploy: false
  host: my-managed-postgres.example.com
  port: 5432
  auth:
    username: efficientai
    database: efficientai
    existingSecret: efficientai-postgres
    secretKeys:
      userPasswordKey: password

