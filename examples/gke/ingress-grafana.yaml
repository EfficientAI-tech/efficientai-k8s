# Add Grafana hostname to the existing efficientai-web Ingress.
# Apply AFTER examples/gke/grafana-proxy.yaml (via make observability-grafana-expose).
#
# Do NOT add the Grafana domain to efficientai-gcp-cert — use grafana-gcp-cert (SNI).
# Helm alternative: examples/gke/values-grafana-ingress.yaml

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: efficientai-web
  namespace: efficientai
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: efficientai-ip
    networking.gke.io/managed-certificates: efficientai-gcp-cert,grafana-gcp-cert
spec:
  rules:
    - host: gcp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: efficientai-web
                port:
                  number: 8000
    - host: grafana.gcp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-proxy
                port:
                  number: 80
