# GKE overlay: high-concurrency worker-imports pool (256–640 Celery threads).
#
# Mirrors the EfficientAI AWS ECS / docker-compose worker split:
#   worker         → celery,audio-metrics  (concurrency 8)
#   worker-imports → imports,diarization,evaluations (threads pool, concurrency 32)
#
# Steady state: 8 pods × 32 threads = 256 concurrent import/eval workers.
# KEDA ceiling: 20 pods × 32 threads = 640 concurrent import/eval workers.
#
# Usage (layer on top of values-gcs.yaml):
#   make keda-install
#   cp examples/gke/values-gcs.yaml my-gke-values.yaml
#   # customize domains, project, bucket, secrets in my-gke-values.yaml
#   helm upgrade --install efficientai charts/efficientai -n efficientai \
#     -f my-gke-values.yaml \
#     -f examples/gke/values-gke-high-concurrency.yaml \
#     --wait
#
# Recommended GKE node pool for worker-imports (8–20 pods at 2 vCPU / 4 GiB each):
#   machine type: e2-standard-8 or n2-standard-8
#   min nodes:    8  (one worker-imports pod per node at steady state)
#   max nodes:    20+ (headroom for web/worker/postgres/redis + KEDA scale-out)
#
# Total worker-imports CPU/memory at steady state: 16 vCPU / 32 GiB reserved.

efficientai:
  web:
    replicaCount: 2
    resources:
      requests: { cpu: "1", memory: "2Gi" }
      limits:   { cpu: "2", memory: "4Gi" }
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 60

  worker:
    replicaCount: 1
    queues: celery,audio-metrics
    concurrency: 8
    command: []
    resources:
      requests: { cpu: "2", memory: "4Gi" }
      limits:   { cpu: "2", memory: "8Gi" }

  workerImports:
    enabled: true
    replicaCount: 8
    queues: imports,diarization,evaluations
    pool: threads
    concurrency: 32
    command: []
    spreadAcrossNodes: true
    resources:
      requests: { cpu: "2", memory: "4Gi" }
      limits:   { cpu: "2", memory: "4Gi" }
    autoscaling:
      enabled: false
    keda:
      enabled: true
      minReplicaCount: 8
      maxReplicaCount: 20
      listLength: 32

postgresql:
  primary:
    resources:
      requests: { cpu: "1", memory: "2Gi" }
      limits:   { cpu: "2", memory: "4Gi" }

redis:
  primary:
    resources:
      requests: { cpu: "500m", memory: "1Gi" }
      limits:   { cpu: "2", memory: "2Gi" }
