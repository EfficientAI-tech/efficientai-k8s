# kube-prometheus-stack Helm values for small clusters.
# Installed by: make observability-install
#
# Set grafana.ini.server.root_url to your public Grafana URL before
# make observability-grafana-expose (if exposing Grafana on GKE).

alertmanager:
  enabled: false

grafana:
  enabled: true
  adminPassword: changeme
  defaultDashboardsEnabled: true
  service:
    type: NodePort
  grafana.ini:
    server:
      root_url: https://grafana.gcp.example.com/
      domain: grafana.gcp.example.com
  persistence:
    enabled: false
  initChownData:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 512Mi
  sidecar:
    dashboards:
      resources:
        limits:
          memory: 128Mi
      healthPort: 8080
    datasources:
      resources:
        limits:
          memory: 128Mi
      healthPort: 8081
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki:3100
      isDefault: false
      jsonData:
        maxLines: 1000

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    retention: 7d

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
